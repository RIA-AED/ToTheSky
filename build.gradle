plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir layout.buildDirectory.dir('mixin')
    exclude 'src/generated/**/.cache'
}

def isCI = System.getenv("CI") == "true"
repositories {
    if (!isCI) {
        // BMCLAPI 国内镜像
        maven { url = "https://bmclapi2.bangbang93.com/maven/" }
        maven { url = "https://bmclapi2.bangbang93.com/libraries/" }
    } else {
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://libraries.minecraft.net/" }
    }
    flatDir {
        dirs 'libs'
    }
    // Create Maven
    // maven { url = "https://maven.createmod.net" }
    // maven { url = "https://maven.ithundxr.dev/mirror" }
    // maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'cpw.mods:modlauncher:10.0.9'
        force 'net.jodah:typetools:0.6.3'
    }
}

