configurations {
    mixinProcessor
}
dependencies {
    mixinProcessor "org.spongepowered:mixin:0.8.5"
    mixinProcessor "com.google.code.gson:gson:2.10.1"
    mixinProcessor "com.google.guava:guava:31.1-jre"
    mixinProcessor "org.ow2.asm:asm:9.7"
    mixinProcessor "org.ow2.asm:asm-tree:9.7"
    mixinProcessor "org.ow2.asm:asm-commons:9.7"
}

tasks.withType(JavaCompile).configureEach {
    if (name == 'compileJava') {
        options.annotationProcessorPath = configurations.mixinProcessor
        options.compilerArgs += [
                "-AmappingTypes=tsrg",
                "-AreobfTsrgFile=${layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile.absolutePath}",
                "-AoutRefMapFile=${layout.buildDirectory.file('mixin/tothesky.refmap.json').get().asFile.absolutePath}",
                "-AMSG_NO_OBFDATA_FOR_TARGET=note",
                "-AMSG_NO_OBFDATA_FOR_METHOD=note"
        ]
    }
}

tasks.named('compileJava') {
    dependsOn 'createMcpToSrg'
    outputs.file(layout.buildDirectory.file('mixin/tothesky.refmap.json'))
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'compileJava'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

def mixinConfigs = 'tothesky.mixins.json,tothesky.oelib.mixins.json'

var writeDevMixinManifest = tasks.register('writeDevMixinManifest') {
    var manifestFile = layout.buildDirectory.file('resources/main/META-INF/MANIFEST.MF')
    outputs.file(manifestFile)
    doLast {
        var file = manifestFile.get().asFile
        file.parentFile.mkdirs()
        file.text = "Manifest-Version: 1.0\r\nMixinConfigs: ${mixinConfigs}\r\n\r\n"
    }
}
tasks.named('processResources', ProcessResources).configure {
    finalizedBy writeDevMixinManifest
}

tasks.named('jar', Jar).configure {
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : mixinConfigs,
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}